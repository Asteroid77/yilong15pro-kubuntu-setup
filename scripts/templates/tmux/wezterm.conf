# Managed by KUbuntu Migrate
#
# WezTerm-only tmux configuration. It uses a dedicated socket/config/save
# directory so unrelated tmux experiments cannot be restored here.

set -g history-limit 100000
set -g status on
set -g status-position bottom
set -g status-style 'bg=colour238,fg=colour250'
set -g status-left-style 'bg=colour238,fg=colour250'
set -g status-right-style 'bg=colour238,fg=colour250'
set -g status-left ' #S '
set -g status-right ' %H:%M '
set -g window-status-style 'bg=colour238,fg=colour250'
set -g window-status-current-style 'bg=colour236,fg=colour255,bold'
set -g window-status-format ' #I:#W '
set -g window-status-current-format ' #I:#W '
set -g set-titles on
set -g set-titles-string '#S'
set -g mouse on
set -g window-size latest
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
set -g default-terminal "tmux-256color"
set -as terminal-features ",wezterm*:RGB"
set -as terminal-features ",wezterm*:clipboard"

setw -g mode-keys vi

bind-key r source-file ~/.config/tmux/wezterm.conf \; display-message 'wezterm tmux config reloaded'

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'

set -g @resurrect-dir "$HOME/.local/state/wezterm-tmux/resurrect"
set -g @continuum-save-interval '1'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-hook-post-save-layout '$HOME/DEV/script/bin/wezterm-tmux-tab filter-resurrect'

run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux
